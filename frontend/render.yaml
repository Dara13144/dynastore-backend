services:
  - type: web
    name: dynastore-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dynastore-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://dynastore-backend.onrender.com
